name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm test:bdd
        if: matrix.node-version != '20'  # cucumber@13 engines 要求 Node ≥22
      - run: pnpm build
      - run: pnpm test:dist

  types-floor:
    name: TS ${{ matrix.ts }} type consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ts: ['5.0.4', latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: 编译类型消费方工程（dist d.ts 对 TS 下界/最新的语法兼容）
        run: npx -y -p typescript@${{ matrix.ts }} tsc -p tests/type-consumer

  typecheck-latest:
    name: typecheck TS latest（主仓前瞻雷达）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 主仓源码 tsc --noEmit @ typescript@latest（devDeps 升级前预警）
        run: node tests/fetch-pinned.mjs && npx -y -p typescript@latest tsc --noEmit

  axios-matrix:
    name: axios ${{ matrix.axios }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        axios: ['1.0.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 换装 peer 下界/最新（runner 一次性环境，改动不外流）
        run: pnpm add -D axios@${{ matrix.axios }}
      - name: axios 适配器测试
        run: pnpm exec vitest run tests/transport.spec.ts
      - run: pnpm build
      - name: dist 冒烟（AxiosTransport 经换装版本加载）
        run: node tests/smoke.cjs && node tests/smoke.mjs

  # 等价清单锚点漂移检测（wop-specs D7：清单行号随源码演进漂移须显性失败）。
  equivalent-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-equivalent-anchors.py
